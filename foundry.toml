[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@openzeppelin-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
    "@solmate/=lib/solmate/src/",
    "@prb/math/=lib/prb-math/src/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
    { access = "read-write", path = "./protocol-config/" },
    { access = "read-write", path = "./scripts/" },
    { access = "read-write", path = "./script/" },
    { access = "read-write", path = "./simulation-output/" },
    { access = "read-write", path = "./test/" },
    { access = "read", path = "./scenarios/" },
]


solc_version = "0.8.28"
via_ir = true
optimizer_runs = 700

[rpc_endpoints]
base = "${RPC_URL}"
anvil = "${ANVIL_RPC_URL}"


[profile.large_simulation]
gas_limit = 100294967295
